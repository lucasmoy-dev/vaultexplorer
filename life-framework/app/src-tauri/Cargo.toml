[package]
name = "life-framework"
version = "0.1.1"
description = "Life Framework — personal development dashboard"
authors = ["Lucas"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a
# Windows/cargo quirk; harmless elsewhere). Mobile links the cdylib.
name = "life_framework_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP for the GitHub release check + APK download. Blocking + rustls so it
# works the same on desktop and Android without a system TLS/OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

# Android-only: the APK auto-installer reaches the plain Android SDK
# (PackageManager, FileProvider, Intent) over JNI via the webview handle.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
