[package]
name = "vaultexplorer"
version = "0.2.27"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vaultexplorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vaultcore = { path = "../../vaultcore" }
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "macros"] }
tiny_http = "0.12"
# YouTube stream resolution that works without yt-dlp (which is Python and
# cannot run on Android). Used on mobile for Download; desktop still
# prefers yt-dlp when it is installed.
rustypipe = { version = "0.11", default-features = false, features = ["rustls-tls-webpki-roots"] }
keyring = { version = "4" }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
lofty = "0.24.0"
libc = "0.2.186"
argon2 = "0.5.3"
kamadak-exif = "0.6.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-deep-link = "2.4.9"
qrcode = "0.14.1"

# Desktop-only integrations: every one of these either shells out to a
# binary that simply isn't present on a mobile OS (git, rclone, syncthing,
# unison, ffmpeg-adjacent tools, a terminal emulator, pkexec) or depends on
# a Linux-desktop-specific mechanism with no mobile equivalent (FUSE
# mounting, xdg-desktop-portal/D-Bus, GTK-native drag-out, the OS trash
# can as a desktop concept). None of this is a choice to leave out --
# there's nothing to shell out *to* on Android/iOS, so these can't be
# made to work there regardless of how they're wired up; see the mobile
# scoping note in `lib.rs`.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Second launches forward to the running process (which opens a new window
# in ~no time) instead of cold-booting a whole second app -- also kills the
# two-instances-double-bisync hazard. The "deep-link" feature re-emits a
# forwarded launch's vaultexplorer:// URL through the deep-link plugin, so
# share links keep working when the app is already open.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
fuser = "0.14"
trash = "5.2.6"
zbus = { version = "5.17.0", default-features = false, features = ["tokio"] }
whisper-rs = "0.16.0"
notify-debouncer-mini = "0.7.0"
tauri-plugin-drag = "2"
# Same gtk-rs version tauri's own linux runtime already links in (see
# Cargo.lock) -- pinning it as a direct dep just gives app_icon.rs a name
# to `use gtk::...` under, not a second GTK copy.
gtk = "0.18.2"
# Reading the geometry of *another* app's window (portal.rs: which monitor
# the app that asked for the file picker is on). GDK can't do that without
# the gdk-x11 backend crate; this is the same pure-Rust X client the
# dependency tree already builds for the clipboard, used directly.
x11rb = "0.13"

# "All files access" (MANAGE_EXTERNAL_STORAGE) has no Rust-side API --
# granting/checking it means calling the plain Android SDK (Environment,
# Settings, Intent) directly over JNI via the webview's jni_handle().
[target.'cfg(target_os = "android")'.dependencies]
# rustypipe pulls in QuickJS (rquickjs) to deobfuscate stream URLs, and
# rquickjs ships no pre-generated bindings for aarch64-linux-android --
# `bindgen` makes it generate them against the NDK headers at build time.
# Declared here rather than used directly: features are additive, so this
# turns the feature on for rustypipe's own copy.
rquickjs = { version = "0.9", features = ["bindgen"] }
jni = "0.21"

