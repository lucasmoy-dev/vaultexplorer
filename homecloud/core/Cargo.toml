[package]
name = "homecore"
version = "0.1.0"
edition = "2021"
description = "Folder sync engine glue: drives a Syncthing process over its REST API"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["process", "time", "net", "io-util", "rt", "macros"] }
base64 = "0.22"
rand = "0.8"
postcard = { version = "1", features = ["alloc"] }
