[package]
name = "homecloud"
version = "0.1.0"
description = "Sync your folders between your own devices"
edition = "2021"

[lib]
name = "homecloud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "macros"] }
homecore = { path = "../../core" }

# Linux only, and only to let the pairing screen open the camera.
#
# WebKitGTK refuses getUserMedia twice over: the media-stream setting is off by
# default, and every request then has to be answered by the embedder, which
# Tauri leaves alone. Both are handled in `enable_camera`.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }

